name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code file size limits
        run: pnpm check:loc

      - name: Test shared contracts
        run: pnpm --filter @lycium/contracts test

      - name: Typecheck web app
        run: pnpm --filter @lycium/web typecheck

      - name: Build web app
        run: pnpm --filter @lycium/web build

      - name: Install browser for E2E smoke tests
        run: pnpm --filter @lycium/web exec playwright install --with-deps chromium

      - name: Run web E2E smoke tests
        run: pnpm --filter @lycium/web e2e

  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install API test dependencies
        run: python -m pip install -e 'services/lycium-api[test]'

      - name: Run API tests
        run: cd services/lycium-api && pytest -q

  workers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install worker test dependencies
        run: python -m pip install -e 'services/lycium-workers[test]'

      - name: Run worker tests
        run: cd services/lycium-workers && PYTHONPATH=src pytest -q
