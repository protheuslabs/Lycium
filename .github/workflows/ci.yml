name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code file size limits
        run: pnpm check:loc

      - name: Check import boundaries
        run: pnpm check:boundaries

      - name: Check professional readiness
        run: pnpm check:readiness

      - name: Test shared contracts
        run: pnpm --filter @lycium/contracts test

      - name: Check generated contract docs
        run: pnpm check:docs

      - name: Typecheck web app
        run: pnpm --filter @lycium/web typecheck

      - name: Build web app
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_LYCIUM_BASE_PATH: /Lycium
          NEXT_PUBLIC_LYCIUM_RUNTIME: static
        run: pnpm --filter @lycium/web build

      - name: Verify GitHub Pages export
        run: pnpm verify:pages-export

      - name: Install browser for E2E smoke tests
        run: pnpm --filter @lycium/web exec playwright install --with-deps chromium

      - name: Run web E2E smoke tests
        run: pnpm --filter @lycium/web e2e

  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install API test dependencies
        run: python -m pip install -e 'services/lycium-api[test]'

      - name: Run API tests
        run: cd services/lycium-api && pytest -q

      - name: Run source index primitive smoke
        run: |
          cd services/lycium-api
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 &
          API_PID=$!
          trap 'kill "$API_PID" || true' EXIT
          python - <<'PY'
          import socket
          import time

          deadline = time.time() + 20
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 8765), timeout=1):
                      raise SystemExit(0)
              except OSError:
                  time.sleep(0.25)
          raise SystemExit("Timed out waiting for Lycium API on 127.0.0.1:8765")
          PY
          cd ../..
          python scripts/source-index-smoke.py \
            fixtures/source-index/primitive-source-batch.json \
            --api-url http://127.0.0.1:8765 \
            --prompt "distributed systems reliability observability latency replication" \
            --batch-id primitive-source-index-ci \
            --context-id primitive-source-index-ci \
            --require-excluded

  source-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install source index test dependencies
        run: python -m pip install -e 'services/source-index[test]'

      - name: Run source index tests
        run: cd services/source-index && pytest -q

  workers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install worker test dependencies
        run: python -m pip install -e 'services/lycium-workers[test]'

      - name: Run worker tests
        run: cd services/lycium-workers && PYTHONPATH=src pytest -q
