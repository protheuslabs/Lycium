[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protheus-source-index"
version = "0.1.0"
description = "Standalone source index service for Protheus Labs AI systems."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3"
]

[project.scripts]
source-index-api = "source_index.main:run"
source-index-import-batch = "source_index.cli:import_batch_cli"
source-index-import-packet = "source_index.cli:import_packet_cli"
source-index-build-packet = "source_index.cli:build_packet_cli"
source-index-openapi = "source_index.openapi:export_cli"
source-index-service-contract = "source_index.cli:service_contract_cli"
source-index-crawl-task = "source_index.crawl.worker:run_cli"

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/source_index"]
